# RevenueOS on one VPS: the web app and the Brain worker.
#
# Start or update (from this folder on the VPS):   ./deploy/deploy.sh
# The app listens on 127.0.0.1:3000 only; the VPS's existing Caddy serves revenueos.b2botix.ai
# and forwards to it (deploy/Caddyfile.snippet). Nothing else is opened to the internet.
#
# Secrets stay on the VPS, in the same files as on a laptop:
#   .env          the app's settings      brain/.env    the worker's settings
# (On a laptop the app's file may be called .env.local instead: either name works.)
# Both are git-ignored and never copied into an image.

name: revenueos

services:
  app:
    build:
      context: .
      args:
        # Compiled into the browser code; Compose reads them from .env.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:?set in .env}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:?set in .env}
    image: revenueos-app
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      TZ: Asia/Kolkata
    ports:
      - "${APP_BIND:-127.0.0.1:3000}:3000"
    # `default` keeps the app reachable as before; `crm` lets it proxy /crm to the CRM containers
    # (which join the same external network as crm-frontend / crm-backend). The network is optional:
    # create it with `docker network create revenueos-shared` before deploying the CRM.
    networks:
      - default
      - crm
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  worker:
    build: ./brain
    image: revenueos-worker
    # The worker signs its platform requests with the machine name: keep it fixed, so a
    # restarted container recognises (and finishes or fails) the requests it had picked up.
    hostname: revenueos-worker
    environment:
      TZ: Asia/Kolkata
    volumes:
      - ./brain/.env:/brain/.env:ro
      - brain-customers:/brain/customers
    restart: unless-stopped
    # Give a running step time to finish its current write before the container stops.
    stop_grace_period: 60s
    logging: *logging

volumes:
  # One folder per customer (plans, maps, logs). Back it up with deploy/backup.sh.
  brain-customers:

networks:
  # Shared with the CRM's compose so the platform can reach crm-frontend / crm-backend by name.
  # Create it once on the host: `docker network create revenueos-shared`.
  crm:
    external: true
    name: revenueos-shared
